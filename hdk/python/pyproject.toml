[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naagmani-hdk"
version = "0.1.0"
description = "Naagmani Plugin Host Development Kit (HDK) for Python"
readme = "README.md"
authors = [{ name = "Naagmani Core Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["naagmani", "plugin", "hdk", "ai", "os", "json-rpc"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["naagmani*"]
