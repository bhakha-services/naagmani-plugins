[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naagmani-privacy-shield"
version = "1.0.0"
description = "Official Enterprise Privacy Shield Plugin for Naagmani OS"
authors = [{ name = "Bhakha Services / Naagmani Security Team" }]
requires-python = ">=3.11"
dependencies = [
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "phonenumbers>=8.13.0",
    "spacy>=3.7.0",
    "naagmani-hdk>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]
